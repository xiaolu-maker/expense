<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>记账</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    background: #F2F2F7;
    color: #000;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 420px; margin: 0 auto; min-height: 100vh; background: #F2F2F7; position: relative; }

  /* 导航栏 */
  .nav-bar {
    height: 44px; display: flex; align-items: center; justify-content: center;
    position: relative; background: #F2F2F7;
  }
  .nav-bar .title { font-size: 17px; font-weight: 600; }
  .nav-bar .left { position: absolute; left: 16px; color: #007AFF; font-size: 17px; cursor: pointer; }
  .nav-bar .right { position: absolute; right: 16px; color: #007AFF; font-size: 15px; cursor: pointer; display: flex; gap: 16px; }

  /* 卡片 */
  .card { background: #fff; border-radius: 14px; margin: 12px 16px; padding: 16px; }

  /* 按钮 */
  .btn-primary {
    background: #007AFF; color: #fff; border: none; border-radius: 12px;
    height: 50px; width: 100%; font-size: 17px; font-weight: 600; cursor: pointer;
  }
  .btn-primary:active { background: #0066D6; }
  .btn-primary:disabled { background: #C7C7CC; }
  .btn-secondary {
    background: #E5E5EA; color: #000; border: none; border-radius: 12px;
    height: 50px; width: 100%; font-size: 17px; font-weight: 500; cursor: pointer;
  }
  .btn-danger { background: #FF3B30; color: #fff; border: none; border-radius: 12px; height: 50px; font-size: 17px; font-weight: 600; cursor: pointer; }

  /* 页面 */
  .page { display: none; padding-bottom: 100px; }
  .page.active { display: block; }

  /* 月份切换 */
  .month-switch {
    display: flex; align-items: center; justify-content: center; gap: 20px;
    margin: 16px 16px 4px;
  }
  .month-switch .arrow {
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    color: #007AFF; font-size: 24px; font-weight: 300; cursor: pointer; user-select: none;
  }
  .month-switch .arrow.disabled { color: #C7C7CC; pointer-events: none; }
  .month-switch .arrow:active { opacity: 0.5; }
  .month-switch .month-label { font-size: 17px; font-weight: 600; min-width: 110px; text-align: center; }

  /* 首页概览 */
  .overview {
    background: #fff; border-radius: 14px; margin: 12px 16px; padding: 20px 16px;
    display: flex; justify-content: space-around; text-align: center;
  }
  .overview .col .label { font-size: 13px; color: #8E8E93; margin-bottom: 6px; }
  .overview .col .value { font-size: 22px; font-weight: 700; }
  .overview .col.personal .value { color: #007AFF; }
  .overview .col.family .value { color: #FF9500; }
  .overview .col.total .value { color: #000; }
  .overview .divider { width: 1px; background: #E5E5EA; }

  .record-list { margin: 0 16px; }
  .record-item {
    background: #fff; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
    display: flex; align-items: center; justify-content: space-between; cursor: pointer;
  }
  .record-item:active { background: #F9F9FB; }
  .record-item .left { display: flex; align-items: center; gap: 12px; }
  .record-item .tag {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: #fff;
  }
  .tag.personal { background: #007AFF; }
  .tag.family { background: #FF9500; }
  .record-item .info .name { font-size: 16px; font-weight: 500; }
  .record-item .info .time { font-size: 13px; color: #8E8E93; margin-top: 2px; }
  .record-item .amount { font-size: 18px; font-weight: 600; }

  .empty { text-align: center; color: #C7C7CC; padding: 60px 20px; font-size: 15px; }

  /* 浮动按钮 */
  .fab {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    width: 56px; height: 56px; background: #007AFF; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(0,122,255,0.4); cursor: pointer; z-index: 100;
  }
  .fab:active { transform: translateX(-50%) scale(0.95); }
  .fab svg { width: 28px; height: 28px; color: #fff; }

  /* 类型选择 */
  .type-selector { display: flex; gap: 12px; margin: 12px 16px; }
  .type-btn {
    flex: 1; height: 50px; border-radius: 12px; border: 2px solid #E5E5EA;
    background: #fff; font-size: 17px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .type-btn.personal.active { border-color: #007AFF; color: #007AFF; background: #E8F1FF; }
  .type-btn.family.active { border-color: #FF9500; color: #FF9500; background: #FFF4E5; }

  /* 输入 */
  .input-card { background: #fff; border-radius: 14px; margin: 12px 16px; padding: 16px; }
  .input-label { font-size: 13px; color: #8E8E93; margin-bottom: 8px; }
  .text-input {
    width: 100%; border: none; outline: none; font-size: 20px; padding: 10px 0;
    border-bottom: 1px solid #E5E5EA;
  }
  .voice-hint { margin-top: 10px; font-size: 13px; color: #8E8E93; display: flex; align-items: center; gap: 6px; }
  .voice-hint svg { width: 16px; height: 16px; color: #007AFF; }

  .parse-preview { margin-top: 16px; padding: 14px; background: #F2F2F7; border-radius: 10px; }
  .parse-preview .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
  .parse-preview .row .k { color: #8E8E93; font-size: 14px; }
  .parse-preview .row .v { font-size: 17px; font-weight: 600; }
  .parse-empty { color: #C7C7CC; font-size: 14px; text-align: center; padding: 12px 0; }

  .btn-area { padding: 20px 16px 0; }

  /* 确认页 */
  .confirm-result {
    background: #fff; border-radius: 14px; margin: 12px 16px; padding: 24px 16px; text-align: center;
  }
  .confirm-result .type-tag {
    display: inline-block; padding: 4px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; margin-bottom: 16px;
  }
  .confirm-result .type-tag.personal { background: #E8F1FF; color: #007AFF; }
  .confirm-result .type-tag.family { background: #FFF4E5; color: #FF9500; }
  .confirm-result .amount-display { font-size: 48px; font-weight: 700; color: #007AFF; margin-bottom: 4px; }
  .confirm-result .amount-display.family { color: #FF9500; }
  .confirm-result .item-display { font-size: 18px; color: #000; margin-bottom: 20px; }
  .edit-row { display: flex; gap: 10px; margin-top: 12px; }
  .edit-row .field { flex: 1; text-align: left; }
  .edit-row .field .label { font-size: 12px; color: #8E8E93; margin-bottom: 4px; }
  .edit-row input {
    width: 100%; padding: 10px 12px; border: 1px solid #E5E5EA; border-radius: 8px;
    font-size: 16px; outline: none;
  }
  .edit-row input:focus { border-color: #007AFF; }

  /* 弹窗 */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    z-index: 200; align-items: flex-end; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #F2F2F7; width: 100%; max-width: 420px; border-radius: 14px 14px 0 0;
    padding: 20px 16px 30px; animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal h3 { text-align: center; font-size: 17px; margin-bottom: 6px; }
  .modal p { text-align: center; color: #8E8E93; font-size: 14px; margin-bottom: 20px; }
  .modal .modal-btns { display: flex; gap: 10px; }
  .modal .modal-btns button { flex: 1; }

  /* Toast */
  .toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8); color: #fff; padding: 14px 24px; border-radius: 10px;
    font-size: 15px; z-index: 300; opacity: 0; transition: opacity 0.2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">

  <!-- ============ 首页 ============ -->
  <div class="page active" id="page-home">
    <div class="nav-bar">
      <div class="title">我的账单</div>
      <div class="right">
        <span onclick="exportData()">导出</span>
        <span onclick="document.getElementById('import-file').click()">导入</span>
      </div>
    </div>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">

    <div class="month-switch">
      <div class="arrow" onclick="changeMonth(-1)">‹</div>
      <div class="month-label" id="month-label">本月</div>
      <div class="arrow" id="next-arrow" onclick="changeMonth(1)">›</div>
    </div>

    <div class="overview">
      <div class="col personal"><div class="label">个人</div><div class="value" id="sum-personal">¥0</div></div>
      <div class="divider"></div>
      <div class="col family"><div class="label">家庭</div><div class="value" id="sum-family">¥0</div></div>
      <div class="divider"></div>
      <div class="col total"><div class="label">合计</div><div class="value" id="sum-total">¥0</div></div>
    </div>

    <div class="record-list" id="record-list"></div>

    <div class="fab" onclick="openAdd()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </div>
  </div>

  <!-- ============ 记一笔 ============ -->
  <div class="page" id="page-add">
    <div class="nav-bar">
      <div class="left" onclick="goHome()">取消</div>
      <div class="title" id="add-title">记一笔</div>
    </div>

    <div class="type-selector">
      <div class="type-btn personal active" id="btn-personal" onclick="selectType('personal')">个人</div>
      <div class="type-btn family" id="btn-family" onclick="selectType('family')">家庭</div>
    </div>

    <div class="input-card">
      <div class="input-label">说一句（用键盘语音输入）</div>
      <input type="text" class="text-input" id="voice-input" placeholder="例如：买菜30块" oninput="onVoiceInput()">
      <div class="voice-hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        点输入框，用键盘的麦克风说话
      </div>
      <div class="parse-preview" id="parse-preview">
        <div class="parse-empty">输入后自动解析金额和物品</div>
      </div>
    </div>

    <div class="btn-area">
      <button class="btn-primary" id="btn-next" onclick="goConfirm()" disabled style="opacity:0.5;">下一步</button>
    </div>
  </div>

  <!-- ============ 确认页 ============ -->
  <div class="page" id="page-confirm">
    <div class="nav-bar">
      <div class="left" onclick="goAdd()">返回</div>
      <div class="title">确认</div>
    </div>

    <div class="confirm-result">
      <div class="type-tag" id="confirm-type-tag">个人</div>
      <div class="amount-display" id="confirm-amount">¥0</div>
      <div class="item-display" id="confirm-item">其他</div>
      <div class="edit-row">
        <div class="field">
          <div class="label">金额（可改）</div>
          <input type="number" id="edit-amount" inputmode="decimal">
        </div>
        <div class="field">
          <div class="label">物品（可改）</div>
          <input type="text" id="edit-item">
        </div>
      </div>
    </div>

    <div class="btn-area">
      <button class="btn-primary" onclick="saveRecord()">保存</button>
    </div>
  </div>

</div>

<!-- 操作菜单（编辑/删除） -->
<div class="modal-overlay" id="action-modal">
  <div class="modal">
    <h3 id="action-title">记录</h3>
    <p id="action-desc"></p>
    <div class="modal-btns">
      <button class="btn-secondary" onclick="closeAction()">取消</button>
      <button class="btn-secondary" onclick="editCurrent()">编辑</button>
      <button class="btn-danger" onclick="deleteCurrent()">删除</button>
    </div>
  </div>
</div>

<!-- 删除确认 -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal">
    <h3>确认删除？</h3>
    <p>删除后无法恢复</p>
    <div class="modal-btns">
      <button class="btn-secondary" onclick="closeDelete()">取消</button>
      <button class="btn-danger" onclick="confirmDelete()">删除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ 数据层 ============
const STORAGE_KEY = 'xiaolu_expense_records_v1';
function getRecords() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function saveRecords(records) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

// ============ 页面导航 ============
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}
function goHome() { showPage('page-home'); renderHome(); }

// ============ 类型选择 ============
let currentType = 'personal';
function selectType(type) {
  currentType = type;
  document.getElementById('btn-personal').classList.toggle('active', type === 'personal');
  document.getElementById('btn-family').classList.toggle('active', type === 'family');
}

// ============ 解析 ============
let parsedAmount = 0, parsedItem = '';
function parseText(text) {
  text = text.trim();
  let amount = 0;
  const numMatch = text.match(/(\d+(?:\.\d+)?)/);
  if (numMatch) amount = parseFloat(numMatch[1]);
  if (!amount) {
    const cnMap = {'零':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
    const cnMatch = text.match(/([一二两三四五六七八九十]+)/);
    if (cnMatch) {
      const s = cnMatch[1];
      if (s === '十') amount = 10;
      else if (s.startsWith('十')) amount = 10 + (cnMap[s[1]] || 0);
      else if (s.includes('十')) amount = (cnMap[s[0]] || 0) * 10 + (cnMap[s[2]] || 0);
      else amount = cnMap[s[0]] || 0;
    }
  }
  let item = text
    .replace(/(\d+(?:\.\d+)?)\s*(元|块|钱|元钱)?/g, '')
    .replace(/([一二两三四五六七八九十]+)\s*(元|块|钱)?/g, '')
    .replace(/^买了/, '')
    .trim();
  if (!item) item = '其他';
  return { amount, item };
}

function onVoiceInput() {
  const text = document.getElementById('voice-input').value;
  const preview = document.getElementById('parse-preview');
  const btnNext = document.getElementById('btn-next');
  if (!text.trim()) {
    preview.innerHTML = '<div class="parse-empty">输入后自动解析金额和物品</div>';
    btnNext.style.opacity = '0.5'; btnNext.disabled = true;
    parsedAmount = 0; parsedItem = '';
    return;
  }
  const { amount, item } = parseText(text);
  parsedAmount = amount; parsedItem = item;
  if (amount > 0) {
    preview.innerHTML = `<div class="row"><span class="k">金额</span><span class="v" style="color:#007AFF;">¥${amount}</span></div><div class="row"><span class="k">物品</span><span class="v">${item}</span></div>`;
  } else {
    preview.innerHTML = `<div class="row"><span class="k">物品</span><span class="v">${item}</span></div><div class="parse-empty" style="margin-top:8px;">未识别到金额，请在确认页手动输入</div>`;
  }
  btnNext.style.opacity = '1'; btnNext.disabled = false;
}

// ============ 新增/编辑 ============
let editingId = null;
function openAdd() {
  editingId = null;
  document.getElementById('add-title').textContent = '记一笔';
  document.getElementById('voice-input').value = '';
  selectType('personal');
  document.getElementById('parse-preview').innerHTML = '<div class="parse-empty">输入后自动解析金额和物品</div>';
  document.getElementById('btn-next').style.opacity = '0.5';
  document.getElementById('btn-next').disabled = true;
  showPage('page-add');
  setTimeout(() => document.getElementById('voice-input').focus(), 300);
}

function goAdd() {
  if (editingId) { openEdit(editingId); return; }
  showPage('page-add');
}

// ============ 确认页 ============
function goConfirm() {
  const typeTag = document.getElementById('confirm-type-tag');
  const amountDisplay = document.getElementById('confirm-amount');
  const itemDisplay = document.getElementById('confirm-item');
  const editAmount = document.getElementById('edit-amount');
  const editItem = document.getElementById('edit-item');
  typeTag.textContent = currentType === 'personal' ? '个人' : '家庭';
  typeTag.className = 'type-tag ' + currentType;
  amountDisplay.textContent = '¥' + (parsedAmount || 0);
  amountDisplay.className = 'amount-display ' + currentType;
  itemDisplay.textContent = parsedItem || '其他';
  editAmount.value = parsedAmount || '';
  editItem.value = parsedItem || '其他';
  showPage('page-confirm');
}
document.getElementById('edit-amount').addEventListener('input', e => {
  document.getElementById('confirm-amount').textContent = '¥' + (e.target.value || 0);
});
document.getElementById('edit-item').addEventListener('input', e => {
  document.getElementById('confirm-item').textContent = e.target.value || '其他';
});

// ============ 保存 ============
function saveRecord() {
  const amount = parseFloat(document.getElementById('edit-amount').value);
  const item = document.getElementById('edit-item').value.trim() || '其他';
  if (!amount || amount <= 0) { showToast('请输入有效金额'); return; }
  const records = getRecords();
  if (editingId) {
    const idx = records.findIndex(r => r.id === editingId);
    if (idx >= 0) {
      records[idx].type = currentType;
      records[idx].amount = amount;
      records[idx].item = item;
    }
  } else {
    records.unshift({
      id: uid(),
      time: new Date().toISOString(),
      type: currentType,
      amount: amount,
      item: item
    });
    // 新增记录后回到当前月份，确保能看到刚记的一笔
    viewMonth = new Date();
    viewMonth.setDate(1);
  }
  saveRecords(records);
  showToast(editingId ? '已更新' : '已保存 ✓');
  editingId = null;
  setTimeout(goHome, 500);
}

// ============ 首页渲染 ============
function fmtMoney(n) {
  return '¥' + n.toLocaleString('zh-CN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}
function fmtTime(iso) {
  const d = new Date(iso);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
  const isYesterday = d.toDateString() === yesterday.toDateString();
  const hm = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  if (sameDay) return '今天 ' + hm;
  if (isYesterday) return '昨天 ' + hm;
  return (d.getMonth()+1) + '-' + d.getDate() + ' ' + hm;
}

// 当前查看的月份
let viewMonth = new Date();
viewMonth.setDate(1);

function changeMonth(delta) {
  const now = new Date();
  const target = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + delta, 1);
  if (target.getFullYear() > now.getFullYear() ||
      (target.getFullYear() === now.getFullYear() && target.getMonth() > now.getMonth())) return;
  viewMonth = target;
  renderHome();
}

function renderHome() {
  const records = getRecords();
  const y = viewMonth.getFullYear(), m = viewMonth.getMonth();
  const monthRecords = records.filter(r => {
    const d = new Date(r.time);
    return d.getFullYear() === y && d.getMonth() === m;
  });
  let pSum = 0, fSum = 0;
  monthRecords.forEach(r => { if (r.type === 'personal') pSum += r.amount; else fSum += r.amount; });
  document.getElementById('sum-personal').textContent = fmtMoney(pSum);
  document.getElementById('sum-family').textContent = fmtMoney(fSum);
  document.getElementById('sum-total').textContent = fmtMoney(pSum + fSum);
  document.getElementById('month-label').textContent = y + '年' + (m + 1) + '月';

  const now = new Date();
  const isCurrent = (y === now.getFullYear() && m === now.getMonth());
  document.getElementById('next-arrow').classList.toggle('disabled', isCurrent);

  const list = document.getElementById('record-list');
  if (monthRecords.length === 0) {
    list.innerHTML = '<div class="empty">这个月还没有记录</div>';
    return;
  }
  list.innerHTML = monthRecords.map(r => `
    <div class="record-item" onclick="openAction('${r.id}')">
      <div class="left">
        <div class="tag ${r.type}">${r.type === 'personal' ? '个人' : '家庭'}</div>
        <div class="info">
          <div class="name">${escapeHtml(r.item)}</div>
          <div class="time">${fmtTime(r.time)}</div>
        </div>
      </div>
      <div class="amount">-${fmtMoney(r.amount)}</div>
    </div>
  `).join('');
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ============ 操作菜单 ============
let currentId = null;
function openAction(id) {
  currentId = id;
  const r = getRecords().find(x => x.id === id);
  if (!r) return;
  document.getElementById('action-title').textContent = r.type === 'personal' ? '个人' : '家庭';
  document.getElementById('action-desc').textContent = `${r.item}  -${fmtMoney(r.amount)}`;
  document.getElementById('action-modal').classList.add('show');
}
function closeAction() { document.getElementById('action-modal').classList.remove('show'); }

function editCurrent() {
  closeAction();
  const r = getRecords().find(x => x.id === currentId);
  if (!r) return;
  openEdit(r.id);
}

function openEdit(id) {
  const r = getRecords().find(x => x.id === id);
  if (!r) return;
  editingId = id;
  document.getElementById('add-title').textContent = '编辑记录';
  selectType(r.type);
  parsedAmount = r.amount;
  parsedItem = r.item;
  document.getElementById('voice-input').value = r.item + ' ' + r.amount + '块';
  document.getElementById('parse-preview').innerHTML = `<div class="row"><span class="k">金额</span><span class="v" style="color:#007AFF;">¥${r.amount}</span></div><div class="row"><span class="k">物品</span><span class="v">${escapeHtml(r.item)}</span></div>`;
  document.getElementById('btn-next').style.opacity = '1';
  document.getElementById('btn-next').disabled = false;
  showPage('page-add');
}

function deleteCurrent() {
  closeAction();
  document.getElementById('delete-modal').classList.add('show');
}
function closeDelete() { document.getElementById('delete-modal').classList.remove('show'); }
function confirmDelete() {
  const records = getRecords().filter(r => r.id !== currentId);
  saveRecords(records);
  closeDelete();
  showToast('已删除');
  renderHome();
}

// ============ 导出（导出当前查看的月份，优先调起系统分享面板）============
async function exportData() {
  const y = viewMonth.getFullYear(), m = viewMonth.getMonth();
  const monthRecords = getRecords().filter(r => {
    const d = new Date(r.time);
    return d.getFullYear() === y && d.getMonth() === m;
  });
  if (monthRecords.length === 0) { showToast('这个月没有记录可导出'); return; }
  const fname = `账单_${y}${(m + 1).toString().padStart(2, '0')}.json`;
  const content = JSON.stringify(monthRecords, null, 2);

  // iPhone：调起系统分享面板，可直接选微信发送
  if (navigator.canShare) {
    try {
      const file = new File([content], fname, { type: 'application/json' });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: fname, text: `${y}年${m + 1}月账单` });
        showToast('已分享');
        return;
      }
    } catch (err) {
      if (err.name === 'AbortError') return;
    }
  }

  // 桌面或其他浏览器：直接下载
  const blob = new Blob([content], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('已导出 ' + fname);
}

// ============ 导入 ============
function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!Array.isArray(data)) throw new Error('格式错误');
      const valid = data.filter(r => r && r.amount && r.type && r.item);
      const records = getRecords();
      const ids = new Set(records.map(r => r.id));
      valid.forEach(r => {
        if (!ids.has(r.id)) { records.unshift({ id: r.id || uid(), time: r.time || new Date().toISOString(), type: r.type, amount: r.amount, item: r.item }); }
      });
      saveRecords(records);
      showToast(`已导入 ${valid.length} 条`);
      renderHome();
    } catch { showToast('导入失败，文件格式错误'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ============ Toast ============
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

// 点击遮罩关闭弹窗
document.getElementById('action-modal').addEventListener('click', e => { if (e.target.id === 'action-modal') closeAction(); });
document.getElementById('delete-modal').addEventListener('click', e => { if (e.target.id === 'delete-modal') closeDelete(); });

// 初始化
renderHome();
</script>
